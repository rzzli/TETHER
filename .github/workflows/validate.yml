name: Validate TETHER
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_LINK_MODE: copy
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, mode: full}
          - {os: ubuntu-latest, mode: core}
          - {os: macos-latest, mode: core}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.2'
          python-version: '3.11.15'
      - name: Install core dependencies
        if: matrix.mode == 'core'
        run: uv sync --locked --python 3.11.15 --no-install-project
      - name: Install ingestion dependencies
        if: matrix.mode == 'full'
        run: uv sync --locked --python 3.11.15 --extra ingest --no-install-project
      - name: Install noneditable runtime with pinned build backend
        run: uv pip install --no-deps . packages/tether --build-constraints tools/build-constraints.txt
      - name: Check dependencies and both lockfiles
        run: |
          uv pip check
          uv lock --check
          uv lock --project packages/tether --check
      - name: Prepare retained reports
        shell: python
        run: |
          import os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'tether-reports').mkdir()
      - name: Install pinned developer tools
        if: matrix.mode == 'full'
        run: uv pip install -r tools/quality-requirements.txt
      - name: Check maintained source quality
        if: matrix.mode == 'full'
        run: uv run --no-sync python -I -B tools/quality.py --output "${{ runner.temp }}/tether-reports/quality"
      - name: Validate installed core
        if: matrix.mode == 'core'
        run: uv run --no-sync python -I -B tools/validate.py --mode core --profile maintained --package --report "${{ runner.temp }}/tether-reports/validation.json"
      - name: Validate installed full scope with parent-process coverage
        if: matrix.mode == 'full'
        run: uv run --no-sync python -I -B -m coverage run --rcfile tools/coverage.ini --data-file "${{ runner.temp }}/tether-reports/coverage.data" tools/validate.py --mode full --profile maintained --package --report "${{ runner.temp }}/tether-reports/validation.json"
      - name: Retain coverage measurement
        if: always() && matrix.mode == 'full'
        run: uv run --no-sync python -I -B -m coverage json --rcfile tools/coverage.ini --data-file "${{ runner.temp }}/tether-reports/coverage.data" -o "${{ runner.temp }}/tether-reports/coverage.json"
      - name: Enforce reviewed coverage baseline
        if: matrix.mode == 'full'
        run: uv run --no-sync python -I -B tools/coverage_gate.py --coverage "${{ runner.temp }}/tether-reports/coverage.json" --validation "${{ runner.temp }}/tether-reports/validation.json"
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ matrix.os }}-${{ matrix.mode }}-py311
          path: ${{ runner.temp }}/tether-reports/
          if-no-files-found: warn
          retention-days: 14
