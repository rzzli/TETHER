name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [core, full]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-12
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7, verified 2026-10-12
        with:
          version: '0.11.2'
          python-version: '3.11'
      - name: Install core
        if: matrix.mode == 'core'
        run: uv sync --locked --python 3.11
      - name: Install ingestion extra
        if: matrix.mode == 'full'
        run: uv sync --locked --python 3.11 --extra ingest
      - name: Validate clean checkout
        run: uv run --no-sync python tools/validate.py --mode ${{ matrix.mode }} --package
