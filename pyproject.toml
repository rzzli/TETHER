[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether-target-engine"
version = "0.4.0"
description = "Dated evidence workflows for auditable target and clinical-program assessment"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
ingest = ["pyarrow==21.0.0"]

[project.scripts]
tether-engine = "tether_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tether_engine", "tether_engine.*"]

[tool.setuptools.package-data]
tether_engine = ["demo/*.json", "demo/v2/*.json", "archive/*.json", "study/resources/*.json"]

