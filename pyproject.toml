[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asof-target-agents"
version = "0.2.0"
description = "Dated evidence workflows for auditable target and clinical-program assessment"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
ingest = ["pyarrow==21.0.0"]

[project.scripts]
asof = "asof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asof = ["demo/*.json", "demo/v2/*.json"]

