[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether-target-agents"
version = "0.6.0"
description = "TETHER: auditable evidence-agent execution with a versioned engine"
requires-python = ">=3.11"
dependencies = ["tether-target-engine==0.4.0"]
license = {file = "LICENSE"}

[project.optional-dependencies]
ingest = ["pyarrow==21.0.0"]

[project.scripts]
tether = "tether._cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tether", "tether.*"]

[tool.uv.sources]
tether-target-engine = {path = "../.."}
