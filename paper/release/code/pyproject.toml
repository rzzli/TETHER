[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asof-p05-replay"
version = "0.1.0"
description = "Versioned source-inclusive reconstruction of the AsOf P05 technical study"
requires-python = ">=3.11,<3.12"
dependencies = ["asof-target-agents==0.3.11", "pyarrow==21.0.0"]
license = {file = "LICENSE"}

[project.scripts]
asof-p05-replay = "asof_p05_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
